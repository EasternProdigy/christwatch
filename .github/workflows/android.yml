name: phone app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already carries the Android SDK; all we do is make
      # sure the pieces this app compiles against are present.
      - name: SDK pieces
        run: |
          set -e
          sdk="$ANDROID_SDK_ROOT"
          mgr="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$mgr" ] || mgr=$(find "$sdk/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$mgr" --licenses > /dev/null 2>&1 || true
          "$mgr" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Check the APK declares what it should
        run: |
          set -e
          apk=android/app/build/outputs/apk/release/app-release.apk
          bt=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$bt/aapt2" dump badging "$apk" > /tmp/badging.txt
          "$bt/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > /tmp/tree.txt
          grep -q "package: name='io.christwatch.phone'" /tmp/badging.txt
          grep -q "launchable-activity: name='io.christwatch.phone.MainActivity'" /tmp/badging.txt
          grep -q "uses-permission: name='android.permission.INTERNET'" /tmp/badging.txt
          grep -q "uses-permission: name='android.permission.RECEIVE_BOOT_COMPLETED'" /tmp/badging.txt
          # the pairing link has to be something the phone will hand to us
          grep -q '"christwatch"' /tmp/tree.txt
          grep -q 'BOOT_COMPLETED' /tmp/tree.txt
          # it must not have quietly acquired anything alarming
          ! grep -qE "uses-permission: name='android.permission.(ACCESS_FINE_LOCATION|READ_CONTACTS|CAMERA|RECORD_AUDIO|QUERY_ALL_PACKAGES|READ_SMS)'" /tmp/badging.txt
          echo "manifest checks passed"
          grep "uses-permission" /tmp/badging.txt
      - name: Name it after the version
        run: |
          set -e
          src=android/app/build/outputs/apk/release/app-release.apk
          ver=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          mkdir -p dist
          cp "$src" "dist/ChristWatch-$ver.apk"
          ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
